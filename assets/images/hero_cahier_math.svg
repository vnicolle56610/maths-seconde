<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Cahier de mathématiques avec crayons">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf7f0"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#123" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="36" fill="url(#fond)"/>

  <!-- Bureau -->
  <path d="M40 410 C210 370 330 430 470 395 C620 355 720 365 860 320 L900 520 L0 520 Z"
        fill="#f2f4f7"/>

  <!-- Cahier -->
  <g filter="url(#ombre)" transform="translate(250 115) rotate(-4)">
    <rect x="0" y="0" width="380" height="275" rx="18" fill="#ffffff"/>
    <line x1="190" y1="0" x2="190" y2="275" stroke="#d9dee8" stroke-width="3"/>
    <g stroke="#d6dce7" stroke-width="2">
      <line x1="28" y1="45" x2="165" y2="45"/>
      <line x1="28" y1="75" x2="165" y2="75"/>
      <line x1="28" y1="105" x2="165" y2="105"/>
      <line x1="28" y1="135" x2="165" y2="135"/>
      <line x1="215" y1="45" x2="350" y2="45"/>
      <line x1="215" y1="75" x2="350" y2="75"/>
      <line x1="215" y1="105" x2="350" y2="105"/>
      <line x1="215" y1="135" x2="350" y2="135"/>
      <line x1="215" y1="165" x2="350" y2="165"/>
    </g>

    <!-- Petits éléments maths -->
    <g fill="none" stroke="#0f2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M45 210 L45 165 M45 210 L120 210"/>
      <path d="M50 200 C75 165 92 180 112 150 C128 125 145 140 155 115"/>
      <path d="M235 210 L320 210 L320 130 Z"/>
      <path d="M236 130 L236 210"/>
    </g>
    <text x="52" y="158" font-family="Georgia, serif" font-size="24" fill="#0f2340">y=f(x)</text>
    <text x="235" y="250" font-family="Georgia, serif" font-size="24" fill="#0f2340">a²+b²=c²</text>
  </g>

  <!-- Crayons -->
  <g transform="translate(635 105) rotate(18)" filter="url(#ombre)">
    <rect x="0" y="0" width="24" height="210" rx="12" fill="#15233f"/>
    <polygon points="0,0 24,0 12,-34" fill="#f2c879"/>
    <polygon points="7,-20 17,-20 12,-34" fill="#15233f"/>
  </g>
  <g transform="translate(690 105) rotate(24)" filter="url(#ombre)">
    <rect x="0" y="0" width="22" height="190" rx="11" fill="#2b8a5e"/>
    <polygon points="0,0 22,0 11,-30" fill="#f2c879"/>
    <polygon points="7,-18 15,-18 11,-30" fill="#2b8a5e"/>
  </g>

  <!-- Règle -->
  <g transform="translate(120 305) rotate(-16)" opacity="0.82">
    <rect x="0" y="0" width="210" height="38" rx="8" fill="#dce8ee"/>
    <g stroke="#8fa2ad" stroke-width="2">
      <line x1="22" y1="0" x2="22" y2="14"/>
      <line x1="50" y1="0" x2="50" y2="20"/>
      <line x1="78" y1="0" x2="78" y2="14"/>
      <line x1="106" y1="0" x2="106" y2="20"/>
      <line x1="134" y1="0" x2="134" y2="14"/>
      <line x1="162" y1="0" x2="162" y2="20"/>
      <line x1="190" y1="0" x2="190" y2="14"/>
    </g>
  </g>

  <!-- Petites formules décoratives -->
  <text x="95" y="110" font-family="Georgia, serif" font-size="38" fill="#0f2340" opacity="0.45">x²</text>
  <text x="720" y="390" font-family="Georgia, serif" font-size="34" fill="#0f2340" opacity="0.42">Δ = b² − 4ac</text>
  <circle cx="765" cy="115" r="34" fill="#5cf048" opacity="0.20"/>
</svg>
