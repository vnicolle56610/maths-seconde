# Devoirs blancs publiés dans la rubrique « Préparer une évaluation ».
#
# Seuls les devoirs blancs vont sur le site, jamais les sujets ni les
# corrigés des évaluations réelles. Rien n'est publié tant qu'une entrée
# n'est pas déclarée ici, et c'est le professeur qui fait avancer « etat » :
#
#   non_publie        rien n'apparaît sur le site
#   annonce           annoncée dans « À venir » (date, format, notions),
#                     sans document : pour que les élèves se projettent
#   sujet             devoir blanc en ligne (fiche + sujet), corrigé annoncé
#   sujet_et_corrige  devoir blanc et corrigé en ligne
#
# Une fois l'évaluation passée, l'entrée reste : elle passe dans
# « Pour réviser — évaluations passées ». Ne pas la supprimer.
#
# Dates : celles du message Pronote (MESSAGE_ELEVES_<id>.md). Le script
# signale un retard sur sujet_prevu / corrige_prevu sans rien publier seul.
# dossier : relatif à la source déclarée dans config_site.yaml.
#
# Puis lancer : ./scripts/lancer_publication.sh

devoirs_blancs:
  - id: MT2
    date: 2026-11-05
    date_affichee: mercredi 4 ou jeudi 5 novembre
    duree: 30 min
    calculatrice: interdite
    notions: [N04]
    dossier: Evaluations/MINITESTS/MT2_N04_2026_11_04
    sujet: DEVOIR_BLANC_MT2_N04.pdf
    corrige: CORRIGE_DEVOIR_BLANC_MT2_N04.pdf
    sujet_prevu: 2026-10-28
    corrige_prevu: 2026-11-02
    etat: sujet_et_corrige
    # Bloc facultatif « Après l'évaluation » (sous l'entrée, dans « Pour réviser ») :
    # vrais sujets, corrigés élèves, remédiation. Publié seulement si la date est
    # passée et rattrapages_termines: true ; fichiers lus dans apres_evaluation/ ;
    # jamais de fichier _PROF. États : non_publie | publie.
    apres_evaluation:
      etat: non_publie
      rattrapages_termines: true
      dossier: Evaluations/MINITESTS/MT2_N04_2026_11_04/apres_evaluation
      rubriques:
        - titre: 📝 Le mini-test
          documents:
            - {fichier: MT2_N04_SUJET_A.pdf, libelle: sujet A}
            - {fichier: MT2_N04_SUJET_B.pdf, libelle: sujet B}
            - {fichier: CORRIGE_MT2_N04_A_ELEVES.pdf, libelle: corrigé A}
            - {fichier: CORRIGE_MT2_N04_B_ELEVES.pdf, libelle: corrigé B}
        - titre: 🔁 Retravailler
          documents:
            - {fichier: FICHE_INDIVIDUELLE_MT2_N04_2nde_R.pdf, libelle: parcours R — Reprendre}
            - {fichier: FICHE_INDIVIDUELLE_MT2_N04_2nde_C.pdf, libelle: parcours C — Consolider}
            - {fichier: FICHE_INDIVIDUELLE_MT2_N04_2nde_A.pdf, libelle: parcours A — Approfondir}
            - {fichier: COMPLEMENT_ISOLER_VARIABLE.pdf, libelle: complément « isoler une variable »}
        - titre: ✔️ Corrigés détaillés
          documents:
            - {fichier: CORRIGE_FICHE_MT2_N04_2nde_R.pdf, libelle: parcours R}
            - {fichier: CORRIGE_FICHE_MT2_N04_2nde_C.pdf, libelle: parcours C}
            - {fichier: CORRIGE_FICHE_MT2_N04_2nde_A.pdf, libelle: parcours A}
            - {fichier: CORRIGE_COMPLEMENT_ISOLER_VARIABLE.pdf, libelle: complément}
        - titre: 👥 Pour les enseignants
          documents:
            - {fichier: PRESENTATION_REMEDIATION_MT2_N04_2nde.pdf, libelle: présentation du dispositif (3 pages)}
      conseil: >-
        Quelle fiche prendre ? Faites d'abord le recto, commun à tous, puis le verso du
        parcours indiqué en classe. Si vous n'étiez pas là, commencez par R et passez au
        parcours suivant si c'est facile. Ne lisez le corrigé qu'après avoir cherché.

  - id: DS1
    date: 2026-11-24
    duree: 50 min
    calculatrice: interdite
    notions: [N02, N03, N04, N05]
    dossier: Evaluations/DS/DS1_N01_N05_2026_11_24
    sujet: DEVOIR_BLANC_DS1_2nde.pdf
    corrige: CORRIGE_DEVOIR_BLANC_DS1_2nde.pdf
    sujet_prevu: 2026-11-16
    corrige_prevu: 2026-11-20
    etat: annonce
