theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: white
      accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.details
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - stylesheets/extra.css?v=2026-11-13
  - stylesheets/automatismes.css?v=2026-11-11d
extra_javascript:
  - javascripts/pdf-new-tab.js
  - javascripts/toutatice-header.js
  - javascripts/frise.js?v=2026-10-31
  - javascripts/goatcounter.js
  - javascripts/compteur-visites.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/automatismes-qcm.js?v=2026-11-11d
